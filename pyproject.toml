[project]
name = "enecoq-data-fetcher"
dynamic = ["version"]
description = "enecoQ power data fetcher - Fetch power usage, cost, and CO2 emission data from enecoQ web service"
readme = "README.md"
authors = [
    { name = "Shibata, Tats" }
]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["enecoq", "power", "energy", "data", "fetcher", "cli", "cyberhome"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.3.3",
    "playwright>=1.40.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/rewse/enecoq-data-fetcher"
Repository = "https://github.com/rewse/enecoq-data-fetcher"
Issues = "https://github.com/rewse/enecoq-data-fetcher/issues"

[project.scripts]
enecoq-data-fetcher = "enecoq_data_fetcher.cli:main"

[tool.hatch.version]
path = "src/enecoq_data_fetcher/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Resolve only versions published at least 96 hours ago, including the
# hatchling build backend that uv build installs into an isolated build
# environment, which uv.lock does not pin.
exclude-newer = "4 days"
# Mirrors the exemption in the maintainer's user-level uv config, so uv.lock
# records the same options with or without that config. It has no effect on
# resolution, because the project never installs itself from PyPI.
exclude-newer-package = { enecoq-data-fetcher = false }

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["collections.abc", "typing"]
